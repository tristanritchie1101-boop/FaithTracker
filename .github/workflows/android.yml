name: Build Android APK (from zip, fixed repositories)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          ZIP_FILE=$(ls -1 *.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip found in repo root"; exit 1
          fi
          unzip -o "$ZIP_FILE" -d ./unzipped

      - name: Detect project root
        id: detect
        run: |
          PROJECT_DIR=$(dirname "$(find ./unzipped -maxdepth 2 -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Add plugin management fallback
        run: |
          SETTINGS_FILE="${{ env.PROJECT_DIR }}/settings.gradle.kts"
          echo "" >> "$SETTINGS_FILE"
          echo "// Added by workflow to ensure plugin repositories" >> "$SETTINGS_FILE"
          echo "pluginManagement {" >> "$SETTINGS_FILE"
          echo "  repositories {" >> "$SETTINGS_FILE"
          echo "    gradlePluginPortal()" >> "$SETTINGS_FILE"
          echo "    google()" >> "$SETTINGS_FILE"
          echo "    mavenCentral()" >> "$SETTINGS_FILE"
          echo "  }" >> "$SETTINGS_FILE"
          echo "}" >> "$SETTINGS_FILE"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.9
          arguments: assembleDebug
          build-root-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: FaithTracker-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
