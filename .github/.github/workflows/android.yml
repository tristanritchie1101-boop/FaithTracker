name: Build Android APK (final AndroidX fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          ZIP_FILE=$(ls -1 *.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip found in repo root"; exit 1
          fi
          unzip -o "$ZIP_FILE" -d ./unzipped

      - name: Detect project root
        id: detect
        run: |
          PROJECT_DIR=$(dirname "$(find ./unzipped -maxdepth 2 -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Detected project dir: $PROJECT_DIR"

      - name: Prepare gradle.properties (AndroidX flags)
        run: |
          mkdir -p "$PROJECT_DIR"
          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g -Dkotlin.daemon.jvm.options="-Xmx1g"
          kotlin.code.style=official
          EOF
          echo "gradle.properties created with AndroidX enabled."

      - name: Inject plugin versions
        run: |
          APP_BUILD="$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/id("com.android.application")/id("com.android.application") version "8.4.2"/' "$APP_BUILD"
          sed -i 's/id("org.jetbrains.kotlin.android")/id("org.jetbrains.kotlin.android") version "1.9.24"/' "$APP_BUILD"

      - name: Build debug APK (no wrapper)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.9
          arguments: assembleDebug
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaithTracker-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
